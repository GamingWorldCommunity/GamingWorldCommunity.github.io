<style>
:root{--bg:#07070f;--bg2:#0d0d1c;--card:rgba(255,255,255,.055);--card2:rgba(255,255,255,.09);--bd:rgba(255,255,255,.11);--tx:#eef0ff;--mut:#9ea3c4;--a:#8b5cf6;--b:#22d3ee;--ok:#34d399;--bad:#f87171;--sh:0 8px 30px rgba(0,0,0,.35)}
[data-theme=light]{--bg:#f3f4fb;--bg2:#e9ebf7;--card:#ffffff;--card2:#f0f1fa;--bd:#dfe2f1;--tx:#15172b;--mut:#5c6180;--sh:0 6px 22px rgba(60,60,120,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx);background:var(--bg);line-height:1.45;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(600px 400px at 15% -5%,rgba(139,92,246,.28),transparent 70%),radial-gradient(500px 380px at 95% 10%,rgba(34,211,238,.18),transparent 70%),var(--bg)}
[data-theme=light] body::before{background:radial-gradient(600px 400px at 15% -5%,rgba(139,92,246,.16),transparent 70%),radial-gradient(500px 380px at 95% 10%,rgba(34,211,238,.14),transparent 70%),var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:0 14px 40px}
.adminbar{display:none;position:sticky;top:0;z-index:50;background:linear-gradient(90deg,var(--a),var(--b));color:#fff;padding:8px 14px;font-size:13px;font-weight:600;align-items:center;gap:8px;flex-wrap:wrap}
body.admin .adminbar{display:flex}
.adminbar .sp{flex:1}
.adminbar button{background:rgba(0,0,0,.25);border:0;color:#fff;border-radius:8px;padding:5px 10px;font-size:12px}
.top{display:flex;justify-content:flex-end;gap:8px;padding:14px 0 0}
.pill{background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;backdrop-filter:blur(10px)}
.pill.on{background:linear-gradient(135deg,var(--a),var(--b));color:#fff;border-color:transparent}
.hero{text-align:center;padding:26px 6px 8px}
.logo{width:76px;height:76px;margin:0 auto 12px;border-radius:22px;display:grid;place-items:center;font-size:38px;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 10px 36px rgba(139,92,246,.45);user-select:none}
h1{margin:0;font-size:clamp(28px,7vw,44px);letter-spacing:.5px;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:900}
.tag{margin:6px auto 0;color:var(--mut);max-width:560px;font-size:15px}
.socials{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:16px}
.soc{display:inline-flex;align-items:center;gap:6px;text-decoration:none;background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;position:relative;transition:.2s}
.soc:hover{transform:translateY(-2px);background:var(--card2)}
.soc.hl{background:linear-gradient(135deg,#059669,#10b981);color:#fff;border-color:transparent;box-shadow:0 6px 20px rgba(16,185,129,.35)}
.soc .tools{top:-10px;right:-6px}
section{margin-top:30px}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.sh h2{margin:0;font-size:20px;flex:1}
.sub{margin:0 0 12px;color:var(--mut);font-size:13.5px}
.addbtn{display:none;background:linear-gradient(135deg,var(--a),var(--b));border:0;color:#fff;font-weight:700;border-radius:10px;padding:7px 12px;font-size:13px}
body.admin .addbtn{display:inline-block}
.prog{height:8px;background:var(--card);border:1px solid var(--bd);border-radius:99px;overflow:hidden;margin-bottom:12px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b));transition:width .4s}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:760px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}}
@media(min-width:960px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;cursor:pointer;transition:.2s;box-shadow:var(--sh);display:flex;flex-direction:column;gap:6px;min-height:118px;overflow:hidden;animation:pop .35s both}
.card:hover{transform:translateY(-3px);border-color:var(--a)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.ico{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:22px;background:linear-gradient(135deg,rgba(139,92,246,.35),rgba(34,211,238,.3))}

.card.item{padding:0;min-height:0}
.card.item .im{aspect-ratio:4/3;background:var(--card2);display:grid;place-items:center;font-size:34px;overflow:hidden}

.card.item h3{padding:10px 12px 12px;font-size:14px}
.card.item .go{position:absolute;left:8px;bottom:auto;top:8px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:3px 8px;border-radius:99px;font-weight:700}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:26px 10px;border:1px dashed var(--bd);border-radius:16px;font-size:14px}
.tools{display:none;position:absolute;top:6px;right:6px;gap:4px;z-index:3}
body.admin .tools{display:flex}
.tools button{width:28px;height:28px;border-radius:8px;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:13px;display:grid;place-items:center;padding:0}

footer{text-align:center;color:var(--mut);font-size:12.5px;margin-top:40px}
footer button{background:none;border:0;color:var(--mut);opacity:.5;font-size:14px}
.ov{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
@media(min-width:700px){.ov{align-items:center}}
.modal{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--bg2);border:1px solid var(--bd);border-radius:22px 22px 0 0;padding:18px;box-shadow:var(--sh);animation:up .25s}

@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.mh{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.mh h3{margin:0;flex:1;font-size:19px;word-break:break-word}
.mh .cl{background:var(--card);border:1px solid var(--bd);border-radius:10px;width:34px;height:34px;font-size:16px}
.mdesc{color:var(--mut);white-space:pre-wrap;word-break:break-word;margin:0 0 12px;font-size:14.5px}
.vid{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000;margin-bottom:12px}
.vid.tall{aspect-ratio:9/16;max-height:62vh;margin-inline:auto}
.vid iframe,.vid video{position:absolute;inset:0;width:100%;height:100%;border:0}
pre.code{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:12px;overflow:auto;max-height:240px;font-size:12.5px;white-space:pre-wrap;word-break:break-all;margin:0 0 12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;min-width:120px;border:0;border-radius:12px;padding:12px 14px;font-weight:700;font-size:14.5px;text-align:center;text-decoration:none;display:inline-block;background:var(--card2);color:var(--tx);border:1px solid var(--bd)}
.btn.pri{background:linear-gradient(135deg,var(--a),var(--b));color:#fff;border:0}
.btn.ok{background:var(--ok);color:#06281c;border:0}
.btn.bad{background:var(--bad);color:#fff;border:0}
label.f{display:block;margin:10px 0 4px;font-size:12.5px;font-weight:700;color:var(--mut)}
.in{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:11px;padding:10px 12px;font:inherit;font-size:15px}
textarea.in{min-height:84px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hint{font-size:12px;color:var(--mut);margin:6px 0 0}
.thumb{width:100%;max-height:150px;object-fit:cover;border-radius:12px;margin-top:8px;display:none}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(30px);opacity:0;background:#111;color:#fff;border:1px solid #333;padding:10px 16px;border-radius:12px;font-size:14px;z-index:200;transition:.3s;max-width:90vw;text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.err{background:#7f1d1d;border-color:#b91c1c}
.toast.good{background:#065f46;border-color:#10b981}
ol.steps{padding-left:20px;color:var(--mut);font-size:13.5px;margin:6px 0 10px}
ol.steps b{color:var(--tx)}
</style>

<script>
"use strict";
/* ================= Ayarlar ================= */
const OWNER = location.hostname.endsWith(".github.io") ? location.hostname.split(".")[0] : "gamingworldcommunity";
const REPO = OWNER + ".github.io";
const DATA_FILE = "data.json";

/* ================= Varsayılan içerik (data.json yoksa bu görünür) ================= */
const DEFAULT = {
  settings: {
    title: "WORLD_GAMEHUB",
    tagline: {tr: "Gaming • Scripts • Community", en: "Gaming • Scripts • Community"},
    about: {
      tr: "WORLD_GAMEHUB, oyuncular için güncel scriptler, oyun içerikleri ve topluluk bağlantıları sunan bir oyun platformudur.\n\nÖzellikle Roblox ve Car Parking 1 & 2 gibi popüler oyunlarda güncel script içerikleri paylaşmayı hedefliyoruz.\n\nNeler sunuyoruz?\n• Roblox için en güncel scriptler\n• Popüler Roblox oyunları için scriptler\n• İstediğiniz Roblox oyunları için script içerikleri\n• Car Parking 1 & 2 için scriptler\n• Yeni oyunlar ve güncellemeler\n• Oyun toplulukları ve takas grupları\n\nİstediğiniz oyun listemizde yoksa TikTok veya Instagram hesabımızdan bize ulaşabilir, oynamak veya script istediğiniz oyunu belirtebilirsiniz.",
      en: "WORLD_GAMEHUB is a gaming platform that offers up-to-date scripts, game content and community links for players.\n\nWe focus on sharing fresh script content for popular games such as Roblox and Car Parking 1 & 2.\n\nWhat do we offer?\n• The latest scripts for Roblox\n• Scripts for popular Roblox games\n• Script content for the Roblox games you request\n• Scripts for Car Parking 1 & 2\n• New games and updates\n• Gaming communities and trade groups\n\nIf the game you are looking for is not on our list, contact us on TikTok or Instagram and tell us which game you want."
    }
  },
  tasks: [],
  links: [],
  listings: [],
  socials: [
    {id:"s1", label:"Güvence", url:"https://t.me/world_gamehubproof", icon:"🛡️", hl:true},
    {id:"s2", label:"TikTok", url:"https://www.tiktok.com/@oyundunyasi.tr", icon:"🎵"},
    {id:"s3", label:"Instagram", url:"https://www.instagram.com/oyundunyasi.tr1", icon:"📸"}
  ]
};

/* ================= Metinler ================= */
const UI = {
  tr:{tasks:"🎯 Görevler",tasksSub:"Önce bu görevleri tamamla, sonra içeriklere göz at.",links:"📜 Scriptler & Bağlantılar",linksSub:"Script, komut, dosya ve linkler.",market:"🛒 İlanlar",marketSub:"Bir ilana dokununca hesap.com.tr'deki ilan sayfasına gidersin.",aboutT:"ℹ️ Hakkında",add:"+ Ekle",open:"Aç",copy:"Kopyala",copied:"Kopyalandı ✓",done:"Tamamlandı ✓",markDone:"Tamamladım",undo:"Geri al",emptyT:"Henüz görev eklenmedi.",emptyL:"Henüz içerik eklenmedi.",emptyM:"Henüz ilan eklenmedi.",shared:"Link kopyalandı",goto:"İlana git",tasksDone:"görev tamamlandı",close:"Kapat"},
  en:{tasks:"🎯 Tasks",tasksSub:"Complete these tasks first, then check out the content.",links:"📜 Scripts & Links",linksSub:"Scripts, commands, files and links.",market:"🛒 Listings",marketSub:"Tap a listing to open it on hesap.com.tr.",aboutT:"ℹ️ About",add:"+ Add",open:"Open",copy:"Copy",copied:"Copied ✓",done:"Done ✓",markDone:"Mark as done",undo:"Undo",emptyT:"No tasks yet.",emptyL:"No content yet.",emptyM:"No listings yet.",shared:"Link copied",goto:"Go to listing",tasksDone:"tasks completed",close:"Close"}
};
const TK = {
  join:{ic:"📢",tr:"Kanala katıl",en:"Join channel",bt:{tr:"Katıl",en:"Join"}},
  like:{ic:"👍",tr:"Videoyu beğen",en:"Like the video",bt:{tr:"Videoya git",en:"Open video"}},
  follow:{ic:"➕",tr:"Hesabı takip et",en:"Follow account",bt:{tr:"Takip et",en:"Follow"}},
  subscribe:{ic:"🔔",tr:"Abone ol",en:"Subscribe",bt:{tr:"Abone ol",en:"Subscribe"}},
  comment:{ic:"💬",tr:"Yorum yap",en:"Comment",bt:{tr:"Yoruma git",en:"Go comment"}},
  watch:{ic:"▶️",tr:"Videoyu izle",en:"Watch video",bt:{tr:"İzle",en:"Watch"}},
  other:{ic:"⭐",tr:"Görev",en:"Task",bt:{tr:"Git",en:"Go"}}
};
const LK = {
  link:{ic:"🔗",tr:"Link",en:"Link"},
  script:{ic:"📜",tr:"Script",en:"Script"},
  command:{ic:"⌨️",tr:"Komut",en:"Command"},
  file:{ic:"📁",tr:"Dosya",en:"File"}
};

/* ================= Yardımcılar ================= */
const $ = s => document.querySelector(s);
const el = (t,c,...k)=>{const e=document.createElement(t);if(c)e.className=c;k.flat().forEach(x=>{if(x==null||x===false)return;e.append(x.nodeType?x:document.createTextNode(x))});return e};
const uid = () => Math.random().toString(36).slice(2,9);
const clone = o => JSON.parse(JSON.stringify(o));
let lang = localStorage.getItem("wgh_lang") || (/^tr/i.test(navigator.language) ? "tr" : "en");
const t = k => UI[lang][k] || k;
const tx = o => !o ? "" : (typeof o === "string" ? o : (o[lang] || o.tr || o.en || ""));
const safeUrl = u => { try{ const x=new URL(String(u||"").trim(), location.href); return ["http:","https:","tg:"].includes(x.protocol) ? x.href : "#"; }catch(e){ return "#"; } };
const getDone = () => { try{ return JSON.parse(localStorage.getItem("wgh_done")||"[]"); }catch(e){ return []; } };
const setDone = a => { try{ localStorage.setItem("wgh_done", JSON.stringify(a)); }catch(e){} };
const previews = {};   // yüklenen fotoğraflar yayına girene kadar burada görünür

let data = clone(DEFAULT);
let admin = false, token = localStorage.getItem("wgh_token") || "", branch = "main";

let toastTimer;
function toast(msg, kind){
  const e=$("#toast"); e.textContent=msg; e.className="toast show "+(kind||"");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>e.classList.remove("show"), 2600);
}

/* ================= Video gömme ================= */
function embed(url){
  if(!url) return null;
  let u; try{ u=new URL(url.trim()); }catch(e){ return null; }
  const h=u.hostname.replace(/^www\.|^m\./,"");
  let id=null;
  if(h==="youtu.be") id=u.pathname.slice(1);
  else if(h.endsWith("youtube.com")){
    if(u.pathname.startsWith("/shorts/")) id=u.pathname.split("/")[2];
    else if(u.pathname.startsWith("/embed/")) id=u.pathname.split("/")[2];
    else id=u.searchParams.get("v");
  }
  if(id && /^[\w-]{6,15}$/.test(id)){
    const v=el("div","vid"); const f=el("iframe");
    f.src="https://www.youtube-nocookie.com/embed/"+id+"?rel=0";
    f.allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"; f.allowFullscreen=true; f.loading="lazy";
    v.append(f); return v;
  }
  if(h.endsWith("tiktok.com")){
    const m=u.pathname.match(/\/video\/(\d+)/);
    if(m){ const v=el("div","vid tall"); const f=el("iframe"); f.src="https://www.tiktok.com/embed/v2/"+m[1]; f.allowFullscreen=true; f.allow="fullscreen"; f.loading="lazy"; v.append(f); return v; }
  }
  if(/\.(mp4|webm|ogg|mov)(\?|$)/i.test(u.pathname)){
    const v=el("div","vid"); const vd=el("video"); vd.src=u.href; vd.controls=true; vd.playsInline=true; vd.preload="metadata"; v.append(vd); return v;
  }
  return null;
}

/* ================= Modal ================= */
function openModal(build){
  const m=$("#modal"); m.innerHTML=""; build(m); $("#ov").classList.add("show"); document.body.style.overflow="hidden";
}
function closeModal(){ $("#ov").classList.remove("show"); $("#modal").innerHTML=""; document.body.style.overflow=""; }
$("#ov").addEventListener("mousedown", e=>{ if(e.target.id==="ov") closeModal(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });
function mHead(m, title){
  const cl=el("button","cl","✕"); cl.onclick=closeModal;
  m.append(el("div","mh", el("h3",null,title), cl));
}

/* ================= Çizim ================= */
function applyUI(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i]").forEach(n=>n.textContent=t(n.dataset.i));
  $("#bLang").textContent = lang.toUpperCase();
  const th=document.documentElement.dataset.theme; $("#bTheme").textContent = th==="dark" ? "🌙" : "☀️";
}

function toolsFor(sec, i, arr){
  const d=el("div","tools");
  const mk=(txt,cls,fn)=>{const b=el("button",cls,txt); b.onclick=e=>{e.stopPropagation();fn()}; return b;};
  if(i>0) d.append(mk("↑","",()=>move(sec,i,-1)));
  if(i<arr.length-1) d.append(mk("↓","",()=>move(sec,i,1)));
  d.append(mk("✎","",()=>openForm(sec,arr[i])));
  d.append(mk("✕","x",()=>del(sec,arr[i])));
  return d;
}

function render(){
  document.title = data.settings.title || "WORLD_GAMEHUB";
  $("#siteTitle").textContent = data.settings.title || "WORLD_GAMEHUB";
  $("#siteTag").textContent = tx(data.settings.tagline);
  $("#aboutTxt").textContent = tx(data.settings.about);
  applyUI();

  /* sosyal */
  const so=$("#socials"); so.innerHTML="";
  data.socials.forEach((s,i)=>{
    const a=el("a","soc"+(s.hl?" hl":""), (s.icon||"🔗")+" "+s.label);
    a.href=safeUrl(s.url); a.target="_blank"; a.rel="noopener noreferrer";
    if(admin) a.append(toolsFor("socials",i,data.socials));
    so.append(a);
  });
  if(admin){ const b=el("button","soc","+"); b.onclick=()=>openForm("socials"); so.append(b); }

  /* görevler */
  const done=getDone();
  const gT=$("#gTasks"); gT.innerHTML="";
  data.tasks.forEach((it,i)=>{
    const k=TK[it.kind]||TK.other;
    const c=el("div","card"+(done.includes(it.id)?" done":""),
      el("div","ico",k.ic), el("h3",null,tx(it.title)), el("span","badge",k[lang]));
    c.onclick=()=>showTask(it);
    if(admin) c.append(toolsFor("tasks",i,data.tasks));
    gT.append(c);
  });
  if(!data.tasks.length) gT.append(el("div","empty",t("emptyT")));
  const n=data.tasks.filter(x=>done.includes(x.id)).length;
  $("#prog").style.display = data.tasks.length ? "block" : "none";
  $("#progBar").style.width = data.tasks.length ? Math.round(n/data.tasks.length*100)+"%" : "0";
  $("#prog").title = n+"/"+data.tasks.length+" "+t("tasksDone");

  /* linkler */
  const gL=$("#gLinks"); gL.innerHTML="";
  data.links.forEach((it,i)=>{
    const k=LK[it.kind]||LK.link;
    const c=el("div","card", el("div","ico",k.ic), el("h3",null,tx(it.title)), tx(it.desc)?el("p",null,tx(it.desc)):null, el("span","badge",k[lang]));
    c.onclick=()=>showLink(it);
    if(admin) c.append(toolsFor("links",i,data.links));
    gL.append(c);
  });
  if(!data.links.length) gL.append(el("div","empty",t("emptyL")));

  /* ilanlar */
  const gM=$("#gMarket"); gM.innerHTML="";
  data.listings.forEach((it,i)=>{
    const im=el("div","im");
    const src=previews[it.image]||it.image;
    if(src){ const g=el("img"); g.src=src; g.alt=""; g.loading="lazy"; g.onerror=()=>{g.remove(); im.textContent="🖼️"}; im.append(g); } else im.textContent="🖼️";
    const c=el("div","card item", im, el("span","go","↗ hesap.com.tr"), el("h3",null,tx(it.title)));
    c.onclick=()=>window.open(safeUrl(it.url),"_blank","noopener");
    if(admin) c.append(toolsFor("listings",i,data.listings));
    gM.append(c);
  });
  if(!data.listings.length) gM.append(el("div","empty",t("emptyM")));
}

/* ================= Detay pencereleri ================= */
function showTask(it){
  const k=TK[it.kind]||TK.other;
  openModal(m=>{
    mHead(m, k.ic+" "+tx(it.title));
    if(tx(it.desc)) m.append(el("p","mdesc",tx(it.desc)));
    const v=embed(it.video); if(v) m.append(v);
    const row=el("div","row");
    const go=el("a","btn pri", k.bt[lang]+" ↗"); go.href=safeUrl(it.url); go.target="_blank"; go.rel="noopener noreferrer";
    row.append(go);
    const isDone=()=>getDone().includes(it.id);
    const dn=el("button","btn"+(isDone()?" ok":""), isDone()?t("done"):t("markDone"));
    dn.onclick=()=>{ let a=getDone(); a=isDone()?a.filter(x=>x!==it.id):[...a,it.id]; setDone(a); closeModal(); render(); };
    row.append(dn); m.append(row);
  });
}
function showLink(it){
  const k=LK[it.kind]||LK.link;
  openModal(m=>{
    mHead(m, k.ic+" "+tx(it.title));
    if(tx(it.desc)) m.append(el("p","mdesc",tx(it.desc)));
    const v=embed(it.video); if(v) m.append(v);
    const row=el("div","row");
    if(it.content){
      m.append(el("pre","code",it.content));
      const cp=el("button","btn pri",t("copy"));
      cp.onclick=async()=>{ try{ await navigator.clipboard.writeText(it.content);}catch(e){ const ta=el("textarea"); ta.value=it.content; document.body.append(ta); ta.select(); document.execCommand("copy"); ta.remove(); } cp.textContent=t("copied"); };
      row.append(cp);
    }
    if(it.url){ const o=el("a","btn"+(it.content?"":" pri"), t("open")+" ↗"); o.href=safeUrl(it.url); o.target="_blank"; o.rel="noopener noreferrer"; row.append(o); }
    m.append(row);
  });
}

/* ================= GitHub'a kaydetme (sadece yönetici) ================= */
async function gh(path, opts={}){
  return fetch("https://api.github.com/repos/"+OWNER+"/"+REPO+"/"+path, {...opts, headers:{Accept:"application/vnd.github+json", Authorization:"Bearer "+token, ...(opts.headers||{})}});
}
async function putFile(path, b64, message){
  let sha;
  const g=await gh("contents/"+path+"?ref="+encodeURIComponent(branch)+"&t="+Date.now());
  if(g.ok){ sha=(await g.json()).sha; }
  const r=await gh("contents/"+path,{method:"PUT",body:JSON.stringify({message,content:b64,sha,branch})});
  if(!r.ok){ let msg="HTTP "+r.status; try{ msg=(await r.json()).message||msg; }catch(e){} throw new Error(msg); }
}
const b64 = s => btoa(unescape(encodeURIComponent(s)));
let queue = Promise.resolve();
function persist(msg){
  const snapshot=JSON.stringify(data,null,2);
  queue = queue.then(async()=>{
    toast("⏳ Kaydediliyor...");
    try{ await putFile(DATA_FILE, b64(snapshot), msg||"Update content"); toast("✅ Kaydedildi (yayına ~1 dk içinde yansır)","good"); }
    catch(e){ toast("❌ Kaydedilemedi: "+e.message,"err"); }
  });
  return queue;
}

async function verify(tok){
  const r=await fetch("https://api.github.com/repos/"+OWNER+"/"+REPO,{headers:{Accept:"application/vnd.github+json",Authorization:"Bearer "+tok}});
  if(!r.ok) throw new Error(r.status===401?"Anahtar geçersiz":"Depoya erişilemedi ("+r.status+")");
  const j=await r.json();
  if(!(j.permissions && j.permissions.push)) throw new Error("Bu anahtarın yazma izni yok (Contents: Read and write gerekli)");
  branch=j.default_branch||"main";
}
async function enterAdmin(tok){
  await verify(tok);
  token=tok; localStorage.setItem("wgh_token",tok); admin=true; document.body.classList.add("admin"); render();
}
function leaveAdmin(){
  admin=false; token=""; localStorage.removeItem("wgh_token"); document.body.classList.remove("admin"); render(); toast("Çıkış yapıldı");
}

function openLogin(){
  if(admin) return;
  openModal(m=>{
    mHead(m,"🔒 Yönetici girişi");
    m.append(el("p","mdesc","Sadece site sahibi düzenleyebilir. Aşağıya GitHub erişim anahtarını (token) yapıştır; telefonda saklanır, kimseyle paylaşılmaz."));
    const inp=el("input","in"); inp.type="password"; inp.placeholder="github_pat_..."; inp.autocomplete="off";
    m.append(inp);
    const ol=el("ol","steps",
      el("li",null,"GitHub → Settings → Developer settings → Fine-grained tokens → Generate new token"),
      el("li",null,"Repository access: sadece ",el("b",null,REPO)),
      el("li",null,"Permissions → Contents: ",el("b",null,"Read and write")),
      el("li",null,"Oluştur, kopyala ve buraya yapıştır"));
    m.append(ol);
    const go=el("button","btn pri","Giriş yap");
    go.onclick=async()=>{ go.textContent="..."; try{ await enterAdmin(inp.value.trim()); closeModal(); toast("✅ Yönetici modu açık","good"); }catch(e){ go.textContent="Giriş yap"; toast("❌ "+e.message,"err"); } };
    m.append(go);
  });
}

/* ================= Ekle / Düzenle formu ================= */
const SCHEMA = {
  tasks:{name:"Görev",fields:[
    {k:"kind",l:"Görev türü",t:"select",o:Object.keys(TK).map(x=>[x,TK[x].ic+" "+TK[x].tr])},
    {k:"title",l:"Başlık",t:"i18n",req:1,ph:["Örn: Telegram kanalına katıl","e.g. Join the Telegram channel"]},
    {k:"desc",l:"Açıklama",t:"i18n-area"},
    {k:"url",l:"Gidilecek bağlantı (kanal / hesap / video linki)",t:"url",req:1,ph:"https://..."},
    {k:"video",l:"Video linki (isteğe bağlı, site içinde oynar: YouTube, TikTok veya .mp4)",t:"url",ph:"https://youtu.be/..."}
  ],def:()=>({kind:"join"})},
  links:{name:"İçerik",fields:[
    {k:"kind",l:"Tür",t:"select",o:Object.keys(LK).map(x=>[x,LK[x].ic+" "+LK[x].tr])},
    {k:"title",l:"Başlık",t:"i18n",req:1},
    {k:"desc",l:"Açıklama",t:"i18n-area"},
    {k:"content",l:"Script / komut metni (Script ve Komut türünde, kopyala butonu çıkar)",t:"area"},
    {k:"url",l:"Bağlantı / dosya linki (Link ve Dosya türünde zorunlu)",t:"url",ph:"https://..."},
    {k:"video",l:"Video linki (isteğe bağlı, site içinde oynar)",t:"url"}
  ],def:()=>({kind:"link"})},
  listings:{name:"İlan",fields:[
    {k:"title",l:"İlan başlığı",t:"i18n",req:1},
    {k:"image",l:"İlan fotoğrafı",t:"image"},
    {k:"url",l:"hesap.com.tr ilan bağlantısı",t:"url",req:1,ph:"https://www.hesap.com.tr/..."}
  ],def:()=>({})},
  socials:{name:"Sosyal bağlantı",fields:[
    {k:"icon",l:"Emoji / simge",t:"text",ph:"🎵"},
    {k:"label",l:"Yazı",t:"text",req:1,ph:"TikTok"},
    {k:"url",l:"Bağlantı",t:"url",req:1,ph:"https://..."},
    {k:"hl",l:"Öne çıkar (yeşil buton, örn. Güvence)",t:"check"}
  ],def:()=>({icon:"🔗"})},
  settings:{name:"Site ayarları",fields:[
    {k:"title",l:"Site adı",t:"text"},
    {k:"tagline",l:"Alt başlık",t:"i18n"},
    {k:"about",l:"Hakkında metni",t:"i18n-area"}
  ],def:()=>({})}
};

function openForm(sec, item){
  const sc=SCHEMA[sec]; const isNew=!item && sec!=="settings";
  const obj = sec==="settings" ? clone(data.settings) : (item ? clone(item) : {id:uid(), ...sc.def()});
  const getters=[]; let pendingImage=null;
  openModal(m=>{
    mHead(m,(isNew?"➕ ":"✎ ")+sc.name);
    sc.fields.forEach(f=>{
      const lab=el("label","f",f.l+(f.req?" *":"")); m.append(lab);
      if(f.t==="select"){
        const s=el("select","in"); f.o.forEach(([v,n])=>{const o=el("option",null,n); o.value=v; if(obj[f.k]===v)o.selected=true; s.append(o)}); m.append(s);
        getters.push(()=>{obj[f.k]=s.value});
      } else if(f.t==="i18n"||f.t==="i18n-area"){
        const cur=obj[f.k]||{}; const mk=()=>f.t==="i18n"?el("input","in"):el("textarea","in");
        const a=mk(), b=mk(); a.value=cur.tr||""; b.value=cur.en||"";
        const ph=f.ph||["",""]; a.placeholder="🇹🇷 Türkçe"+(ph[0]?" — "+ph[0]:""); b.placeholder="🇬🇧 English"+(ph[1]?" — "+ph[1]:"");
        m.append(a); b.style.marginTop="6px"; m.append(b); m.append(el("p","hint","İngilizce boş kalırsa Türkçe gösterilir."));
        getters.push(()=>{obj[f.k]={tr:a.value.trim(),en:b.value.trim()}});
      } else if(f.t==="area"){
        const a=el("textarea","in"); a.value=obj[f.k]||""; a.style.minHeight="130px"; a.style.fontFamily="monospace"; m.append(a);
        getters.push(()=>{obj[f.k]=a.value});
      } else if(f.t==="check"){
        const c=el("input"); c.type="checkbox"; c.checked=!!obj[f.k]; lab.prepend(c," "); getters.push(()=>{obj[f.k]=c.checked});
      } else if(f.t==="image"){
        const file=el("input","in"); file.type="file"; file.accept="image/*";
        const th=el("img","thumb"); if(obj.image){ th.src=previews[obj.image]||obj.image; th.style.display="block"; }
        const url=el("input","in"); url.placeholder="veya fotoğraf linki: https://..."; url.style.marginTop="6px"; if(obj.image&&/^https?:/.test(obj.image)) url.value=obj.image;
        m.append(file,th,url,el("p","hint","Telefondan fotoğraf seç; otomatik küçültülüp siteye yüklenir."));
        file.onchange=()=>{ const fl=file.files[0]; if(!fl) return; shrink(fl).then(d=>{ pendingImage=d; th.src=d; th.style.display="block"; }).catch(()=>toast("Fotoğraf okunamadı","err")); };
        getters.push(()=>{ if(!pendingImage && url.value.trim()) obj.image=url.value.trim(); });
      } else {
        const a=el("input","in"); a.value=obj[f.k]||""; if(f.ph)a.placeholder=f.ph; if(f.t==="url"){a.type="url";a.inputMode="url";} m.append(a);
        getters.push(()=>{obj[f.k]=a.value.trim()});
      }
    });
    const row=el("div","row"); row.style.marginTop="14px";
    const sv=el("button","btn pri","Kaydet"); const ca=el("button","btn","Vazgeç"); ca.onclick=closeModal;
    sv.onclick=async()=>{
      getters.forEach(g=>g());
      for(const f of sc.fields){
        if(f.req){ const v=obj[f.k]; const ok=(f.t==="i18n"||f.t==="i18n-area")?(v&&(v.tr||v.en)):v; if(!ok){ toast("Zorunlu alan boş: "+f.l.split(" (")[0],"err"); return; } }
      }
      if(sec==="links"){
        if((obj.kind==="script"||obj.kind==="command") && !obj.content){ toast("Script/komut metni boş","err"); return; }
        if((obj.kind==="link"||obj.kind==="file") && !obj.url){ toast("Bağlantı boş","err"); return; }
      }
      if(sec==="listings" && !obj.image && !pendingImage){ toast("Fotoğraf seç ya da link ekle","err"); return; }
      sv.disabled=true; sv.textContent="⏳";
      if(pendingImage){
        const path="images/"+obj.id+"-"+Date.now().toString(36)+".jpg";
        try{ await putFile(path, pendingImage.split(",")[1], "Add image"); previews[path]=pendingImage; obj.image=path; }
        catch(e){ toast("❌ Fotoğraf yüklenemedi: "+e.message,"err"); sv.disabled=false; sv.textContent="Kaydet"; return; }
      }
      if(sec==="settings") data.settings=obj;
      else { const arr=data[sec]; const i=arr.findIndex(x=>x.id===obj.id); if(i>=0)arr[i]=obj; else arr.push(obj); }
      closeModal(); render(); persist((isNew?"Add ":"Edit ")+sec);
    };
    row.append(sv,ca); m.append(row);
  });
}

function shrink(file){
  return new Promise((res,rej)=>{
    const img=new Image(), r=new FileReader();
    r.onload=()=>{ img.onload=()=>{ const M=900; let w=img.width,h=img.height; const s=Math.min(1,M/Math.max(w,h)); w=Math.round(w*s); h=Math.round(h*s);
      const c=document.createElement("canvas"); c.width=w; c.height=h; c.getContext("2d").drawImage(img,0,0,w,h); res(c.toDataURL("image/jpeg",.82)); }; img.onerror=rej; img.src=r.result; };
    r.onerror=rej; r.readAsDataURL(file);
  });
}

function move(sec,i,d){ const a=data[sec]; const j=i+d; if(j<0||j>=a.length)return; [a[i],a[j]]=[a[j],a[i]]; render(); persist("Reorder "+sec); }
function del(sec,item){ if(!confirm("Silinsin mi?")) return; data[sec]=data[sec].filter(x=>x.id!==item.id); render(); persist("Delete from "+sec); }

/* ================= Başlat ================= */
(function init(){
  const th=localStorage.getItem("wgh_theme"); if(th){ document.documentElement.dataset.theme=th; $("meta[name=theme-color]").content=th==="dark"?"#07070f":"#f3f4fb"; }
  render();
  fetch(DATA_FILE+"?t="+Date.now()).then(r=>r.ok?r.json():null).then(d=>{
    if(d && d.settings){ data={...clone(DEFAULT),...d,settings:{...DEFAULT.settings,...d.settings}}; render(); }
  }).catch(()=>{});
  if(token) enterAdmin(token).catch(()=>{ token=""; localStorage.removeItem("wgh_token"); });
  if(location.hash==="#admin") openLogin();
})();

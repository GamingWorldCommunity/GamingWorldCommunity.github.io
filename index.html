<style>
:root{
    --bg:#050510;
    --card:rgba(14,14,30,.86);
    --line:rgba(255,255,255,.08);
    --purple:#9d3dff;
    --green:#22d37a;
    --text:#fff;
    --muted:#a9a9c0;
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}

body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    min-height:100vh;
    color:var(--text);
    background:
        radial-gradient(circle at 15% 10%,rgba(130,0,255,.25),transparent 35%),
        radial-gradient(circle at 85% 90%,rgba(0,150,255,.2),transparent 35%),
        var(--bg);
    background-attachment:fixed;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;inset:0;
    background:
        linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);
    background-size:40px 40px;
    pointer-events:none;
}

.container{
    position:relative;z-index:1;
    width:100%;max-width:680px;margin:auto;
    padding:20px 16px 60px;
}

/* TOP BAR */
.topbar{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    margin-bottom:22px;
}

.lang-buttons{display:flex;gap:6px;padding:4px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.lang-buttons button{
    border:0;background:transparent;color:var(--muted);
    padding:8px 14px;border-radius:10px;cursor:pointer;
    font-size:13px;font-family:inherit;transition:.2s;
}
.lang-buttons button.active{background:rgba(140,40,255,.4);color:#fff;box-shadow:0 0 14px rgba(150,0,255,.4)}

.share-btn{
    border:1px solid var(--line);background:rgba(255,255,255,.05);color:#fff;
    padding:9px 14px;border-radius:12px;cursor:pointer;font-size:13px;font-family:inherit;transition:.2s;
}
.share-btn:hover{background:rgba(140,40,255,.25)}

/* HERO */
.logo{text-align:center;margin-bottom:6px}
.logo-badge{
    width:74px;height:74px;margin:0 auto 14px;border-radius:22px;
    display:flex;align-items:center;justify-content:center;font-size:36px;
    background:linear-gradient(135deg,rgba(140,40,255,.5),rgba(0,140,255,.35));
    border:1px solid rgba(190,110,255,.55);
    box-shadow:0 0 30px rgba(140,40,255,.4);
    animation:float 4s ease-in-out infinite;
}
@keyframes float{50%{transform:translateY(-6px)}}

.logo h1{
    font-size:clamp(28px,8vw,46px);font-weight:900;letter-spacing:1px;
    background:linear-gradient(90deg,#fff,#d9b3ff 50%,#8fd0ff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 14px rgba(150,50,255,.5));
}
.logo p{margin-top:8px;color:var(--muted);font-size:15px}

/* ACTION BUTTONS */
.top-buttons{
    display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0 14px;
}
.action{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    min-height:76px;padding:10px 6px;border-radius:16px;
    text-decoration:none;color:#fff;font-family:inherit;font-size:13px;font-weight:600;text-align:center;line-height:1.25;
    background:rgba(140,40,255,.16);border:1px solid rgba(175,90,255,.5);
    cursor:pointer;transition:.2s;
}
.action .ico{font-size:22px}
.action:hover{transform:translateY(-3px);background:rgba(140,40,255,.3);box-shadow:0 0 22px rgba(140,0,255,.35)}
.action:active{transform:scale(.96)}
.action.proof{
    background:rgba(34,211,122,.14);border-color:rgba(34,211,122,.6);
    box-shadow:0 0 14px rgba(34,211,122,.15);
}
.action.proof:hover{background:rgba(34,211,122,.26);box-shadow:0 0 24px rgba(34,211,122,.4)}

/* QUICK NAV */
.quick-nav{
    display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;margin-bottom:4px;
    scrollbar-width:none;
}
.quick-nav::-webkit-scrollbar{display:none}
.chip{
    flex:none;display:flex;align-items:center;gap:7px;
    padding:9px 14px;border-radius:999px;text-decoration:none;color:#fff;font-size:13px;
    background:rgba(255,255,255,.05);border:1px solid var(--line);transition:.2s;
}
.chip:hover{background:rgba(140,40,255,.22);border-color:rgba(175,90,255,.5)}
.chip img{width:16px;height:16px}

/* CARDS */
.card{
    --c:#9d3dff;
    margin-top:16px;padding:18px;border-radius:22px;
    background:var(--card);border:1px solid var(--line);
    border-top:2px solid var(--c);
    box-shadow:0 8px 30px rgba(0,0,0,.35),0 0 24px color-mix(in srgb,var(--c) 14%,transparent);
    backdrop-filter:blur(10px);
    scroll-margin-top:14px;
    opacity:0;transform:translateY(14px);
    animation:rise .5s ease forwards;
}
@keyframes rise{to{opacity:1;transform:none}}

.card-title{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:800;margin-bottom:12px}
.icon-box{
    width:40px;height:40px;border-radius:12px;flex:none;
    display:flex;align-items:center;justify-content:center;font-size:20px;
    background:color-mix(in srgb,var(--c) 22%,transparent);
    border:1px solid color-mix(in srgb,var(--c) 55%,transparent);
}
.icon-box img{width:22px;height:22px}

.subcategory{
    margin-top:12px;padding:13px;border-radius:16px;
    background:rgba(255,255,255,.03);border:1px solid var(--line);
}
.subcategory h3{display:flex;align-items:center;gap:8px;font-size:15px;color:#eee;margin-bottom:2px}
.subcategory h3 img{width:18px;height:18px}
.subhint{color:var(--muted);font-size:12.5px;margin:2px 0 4px;line-height:1.5}

.link{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    min-height:52px;margin-top:9px;padding:12px 15px;border-radius:14px;
    text-decoration:none;color:#fff;
    background:rgba(255,255,255,.05);border:1px solid var(--line);
    transition:.18s;user-select:none;
}
.link .l-left{display:flex;align-items:center;gap:10px;font-size:14.5px;min-width:0}
.link .l-left span{overflow-wrap:anywhere}
.link .emoji{font-size:18px;flex:none}
.link .arrow{color:var(--muted);flex:none;transition:.18s}
.link:hover{transform:translateY(-2px);background:rgba(140,40,255,.15);border-color:rgba(175,90,255,.55);box-shadow:0 0 18px rgba(140,0,255,.22)}
.link:hover .arrow{color:#fff;transform:translate(2px,-2px)}
.link:active{transform:scale(.97)}

.link.proof{background:rgba(34,211,122,.1);border-color:rgba(34,211,122,.45)}
.link.proof:hover{background:rgba(34,211,122,.2);border-color:rgba(34,211,122,.8);box-shadow:0 0 20px rgba(34,211,122,.3)}

footer{text-align:center;margin-top:34px;color:#777;font-size:13px}

/* BACK TO TOP */
.to-top{
    position:fixed;right:16px;bottom:18px;z-index:50;
    width:46px;height:46px;border-radius:14px;border:1px solid rgba(175,90,255,.6);
    background:rgba(20,10,45,.9);color:#fff;font-size:20px;cursor:pointer;
    opacity:0;pointer-events:none;transform:translateY(10px);transition:.25s;
}
.to-top.show{opacity:1;pointer-events:auto;transform:none}

/* TOAST */
.toast{
    position:fixed;left:50%;bottom:80px;z-index:2000;transform:translate(-50%,20px);
    padding:11px 18px;border-radius:12px;background:rgba(20,10,45,.95);
    border:1px solid rgba(175,90,255,.6);font-size:13px;opacity:0;pointer-events:none;transition:.25s;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* RULES MODAL */
.rules-overlay{
    position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;
    padding:16px;background:rgba(0,0,0,.8);backdrop-filter:blur(8px);
}
.rules-overlay.show{display:flex}

.rules-modal{
    position:relative;width:100%;max-width:600px;max-height:86vh;overflow-y:auto;padding:24px;
    border-radius:22px;
    background:radial-gradient(circle at top right,rgba(130,0,255,.18),transparent 40%),#0d0d1c;
    border:1px solid rgba(170,80,255,.6);box-shadow:0 0 35px rgba(130,0,255,.28);
    scrollbar-color:#8134bd #111122;
    animation:pop .25s ease;
}
@keyframes pop{from{opacity:0;transform:scale(.95)}}

.rules-header{padding-right:38px;margin-bottom:18px}
.rules-header h2{font-size:clamp(18px,5vw,24px);line-height:1.4}
.rules-subtitle{color:var(--muted);font-size:13px;margin-top:8px;line-height:1.5}

.rules-close{
    position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:11px;
    border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:#fff;font-size:23px;cursor:pointer;
}
.rules-close:hover{background:rgba(180,50,255,.3)}

.rules-list{list-style:none;display:flex;flex-direction:column;gap:9px}
.rules-list li{
    display:flex;align-items:flex-start;gap:11px;padding:12px;border-radius:13px;
    background:rgba(255,255,255,.035);border:1px solid var(--line);
    color:#e9e6f2;font-size:14px;line-height:1.65;overflow-wrap:anywhere;
}
.rule-number{
    display:flex;align-items:center;justify-content:center;flex:none;width:28px;height:28px;border-radius:9px;
    background:rgba(145,50,255,.2);border:1px solid rgba(175,100,255,.35);color:#d5aaff;font-size:12px;font-weight:800;
}

.rules-warning{
    margin-top:14px;padding:14px;border-radius:13px;
    background:rgba(255,170,0,.07);border:1px solid rgba(255,190,50,.25);
    color:#f2dca7;font-size:13px;line-height:1.7;
}
.rules-thanks{text-align:center;margin-top:16px;color:#d5aaff;font-size:14px;line-height:1.7}
.rules-footer{display:flex;justify-content:center;margin-top:18px}
.rules-done{
    border:1px solid rgba(180,80,255,.55);background:rgba(130,0,255,.25);color:#fff;
    padding:13px 30px;border-radius:13px;font-size:14px;font-family:inherit;cursor:pointer;
}
.rules-done:hover{background:rgba(130,0,255,.42);box-shadow:0 0 18px rgba(150,0,255,.3)}

.about-body p{color:#e0dcef;font-size:14px;line-height:1.75;margin-top:8px}

@media(max-width:420px){
    .top-buttons{gap:8px}
    .action{font-size:12px;min-height:70px}
    .card{padding:15px}
    .card-title{font-size:18px}
}

@media(prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
    .card{opacity:1;transform:none}
}
</style>

/* ---------- yardımcılar ---------- */
function makeIcon(icon, cls){
    // emoji ise metin, değilse simpleicons görseli
    if(/^[a-z0-9]+$/i.test(icon)){
        const img = document.createElement("img");
        img.src = "https://cdn.simpleicons.org/" + icon + "/ffffff";
        img.alt = "";
        img.loading = "lazy";
        img.onerror = () => { img.replaceWith(document.createTextNode("🔗")); };
        if(cls) img.className = cls;
        return img;
    }
    return document.createTextNode(icon);
}

function makeLink(l, t){
    const a = document.createElement("a");
    a.className = "link" + (l.proof ? " proof" : "");
    a.href = l.url;
    a.target = "_blank";
    a.rel = "noopener";

    const left = document.createElement("span");
    left.className = "l-left";
    const em = document.createElement("span");
    em.className = "emoji";
    em.textContent = l.emoji;
    const label = document.createElement("span");
    label.textContent = t[l.key];
    left.append(em, label);

    const arrow = document.createElement("span");
    arrow.className = "arrow";
    arrow.textContent = "↗";

    a.append(left, arrow);
    return a;
}

function renderSections(t){
    const wrap = document.getElementById("sections");
    const nav  = document.getElementById("quickNav");
    wrap.replaceChildren();
    nav.replaceChildren();

    sections.forEach((s, i) => {
        // hızlı menü
        const chip = document.createElement("a");
        chip.className = "chip";
        chip.href = "#" + s.id;
        chip.append(makeIcon(s.icon));
        const chipText = document.createElement("span");
        chipText.textContent = t[s.titleKey];
        chip.append(chipText);
        nav.appendChild(chip);

        // kart
        const card = document.createElement("section");
        card.className = "card";
        card.id = s.id;
        card.style.setProperty("--c", s.color);
        card.style.animationDelay = (i * 70) + "ms";

        const title = document.createElement("div");
        title.className = "card-title";
        const box = document.createElement("span");
        box.className = "icon-box";
        box.append(makeIcon(s.icon));
        const name = document.createElement("span");
        name.textContent = t[s.titleKey];
        title.append(box, name);
        card.appendChild(title);

        if(s.groups){
            s.groups.forEach(g => {
                const sub = document.createElement("div");
                sub.className = "subcategory";
                const h3 = document.createElement("h3");
                h3.append(makeIcon(g.icon || g.emoji));
                const hs = document.createElement("span");
                hs.textContent = t[g.titleKey];
                h3.append(hs);
                sub.appendChild(h3);

                if(g.hintKey){
                    const hint = document.createElement("p");
                    hint.className = "subhint";
                    hint.textContent = t[g.hintKey];
                    sub.appendChild(hint);
                }
                g.links.forEach(l => sub.appendChild(makeLink(l, t)));
                card.appendChild(sub);
            });
        }else{
            s.links.forEach(l => card.appendChild(makeLink(l, t)));
        }

        wrap.appendChild(card);
    });
}

/* ---------- hakkında penceresi içeriği ---------- */
function renderAbout(t){
    const body = document.getElementById("aboutBody");
    body.replaceChildren();

    const addP = txt => { const p = document.createElement("p"); p.textContent = txt; body.appendChild(p); };
    const addH = txt => { const h = document.createElement("h4"); h.textContent = txt; body.appendChild(h); };

    t.aboutIntro.forEach(addP);

    addH(t.aboutOfferTitle);
    const ul = document.createElement("ul");
    ul.className = "about-list";
    t.aboutOffer.forEach(item => {
        const li = document.createElement("li");
        li.textContent = item;
        ul.appendChild(li);
    });
    body.appendChild(ul);

    addH(t.aboutWishTitle);
    addP(t.aboutWish);

    addH(t.aboutContactTitle);
    addP(t.aboutContact);
    body.appendChild(makeLink({emoji:"🎵", key:"aboutTikTok", url:"https://www.tiktok.com/@oyundunyasi.tr"}, t));
    body.appendChild(makeLink({emoji:"📸", key:"aboutInstagram", url:"https://www.instagram.com/oyundunyasi.tr1?stkn=ZWF2eDB5bDJ5bHpp"}, t));
}

/* ---------- dil ---------- */
function setLanguage(lang){
    if(!translations[lang]) lang = "tr";
    currentLang = lang;
    const t = translations[lang];
    document.documentElement.lang = lang;

    const set = (id, v) => { document.getElementById(id).textContent = v; };
    set("description", t.description);
    set("aboutButton", t.aboutButton);
    set("rulesButtonText", t.rulesButton);
    set("proofButtonText", t.proofButton);
    set("shareText", t.share);
    set("rulesTitle", t.rulesTitle);
    set("rulesSubtitle", t.rulesSubtitle);
    set("rulesWarning", t.rulesWarning);
    set("rulesThanks", t.rulesThanks);
    set("rulesDone", t.rulesDone);

    renderSections(t);
    renderAbout(t);
    set("aboutTitle", t.aboutTitle);
    set("aboutDone", t.rulesDone);

    const list = document.getElementById("rulesList");
    list.replaceChildren();
    t.rules.forEach((rule, index) => {
        const li = document.createElement("li");
        const number = document.createElement("span");
        const text = document.createElement("span");
        number.className = "rule-number";
        number.textContent = String(index + 1).padStart(2, "0");
        text.textContent = rule;
        li.append(number, text);
        list.appendChild(li);
    });

    document.getElementById("trBtn").classList.toggle("active", lang === "tr");
    document.getElementById("enBtn").classList.toggle("active", lang === "en");

    try{ localStorage.setItem("language", lang); }catch(e){}
}

/* ---------- kurallar penceresi ---------- */
let lastFocus = null;

function openModal(id, focusId){
    const o = document.getElementById(id);
    lastFocus = document.activeElement;
    o.classList.add("show");
    o.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";
    document.getElementById(focusId).focus();
}

function closeModal(id){
    const o = document.getElementById(id);
    o.classList.remove("show");
    o.setAttribute("aria-hidden", "true");
    document.body.style.overflow = "";
    if(lastFocus) lastFocus.focus();
}

function openRules(){ openModal("rulesOverlay", "rulesDone"); }
function closeRules(){ closeModal("rulesOverlay"); }
function openAbout(){ openModal("aboutOverlay", "aboutDone"); }

function overlayClick(e){
    if(e.target.classList.contains("rules-overlay")) closeModal(e.target.id);
}

document.addEventListener("keydown", e => {
    const o = document.querySelector(".rules-overlay.show");
    if(!o) return;

    if(e.key === "Escape"){ closeModal(o.id); return; }

    // Tab ile pencerenin dışına çıkmayı engelle
    if(e.key === "Tab"){
        const f = o.querySelectorAll("button");
        const first = f[0], last = f[f.length - 1];
        if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
        else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
    }
});

/* ---------- paylaş ---------- */
function showToast(msg){
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    setTimeout(() => el.classList.remove("show"), 2200);
}

async function sharePage(){
    const url = location.href;
    try{
        if(navigator.share){
            await navigator.share({title:"WORLD_GAMEHUB", url});
            return;
        }
    }catch(e){ return; }

    try{
        await navigator.clipboard.writeText(url);
        showToast(translations[currentLang].copied);
    }catch(e){
        showToast(url);
    }
}

/* ---------- yukarı çık butonu ---------- */
window.addEventListener("scroll", () => {
    document.getElementById("toTop").classList.toggle("show", window.scrollY > 500);
}, {passive:true});

try{ savedLanguage = localStorage.getItem("language"); }catch(e){}
if(!savedLanguage){
    savedLanguage = (navigator.language || "tr").toLowerCase().startsWith("tr") ? "tr" : "en";
}
setLanguage(savedLanguage);
